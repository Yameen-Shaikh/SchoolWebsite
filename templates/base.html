<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AYK{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header__inner">
      <div class="brand" aria-label="AYK brand">
          <div class="brand__name">Welcome</div>
      </div>

      <nav class="nav" aria-label="Primary navigation">
        <a class="nav__link" href="/">Home</a>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main">
    {% block content %}{% endblock %}
  </main>

  <div class="media-modal" aria-hidden="true" role="dialog" aria-label="Media preview">
    <div class="media-modal__backdrop" data-modal-close="true"></div>
    <div class="media-modal__panel" role="document">
      <button class="media-modal__close" type="button" aria-label="Close">✕</button>
      <div class="media-modal__content" id="media-modal-content"></div>
    </div>
  </div>

  <script>
    (function () {
      const modal = document.querySelector('.media-modal');
      const content = document.getElementById('media-modal-content');
      const closeBtn = modal?.querySelector('.media-modal__close');

      function openMedia({ type, poster, src }) {
        if (!modal || !content) return;

        content.innerHTML = '';

        if (type === 'image') {
          const img = document.createElement('img');
          img.src = src;
          img.alt = 'Activity preview';
          content.appendChild(img);
        } else if (type === 'video') {
          const video = document.createElement('video');
          video.controls = true;
          video.playsInline = true;
          video.poster = poster || '';

          const source = document.createElement('source');
          source.src = src;
          source.type = 'video/mp4';

          video.appendChild(source);
          content.appendChild(video);
        }

        modal.setAttribute('aria-hidden', 'false');
        modal.classList.add('media-modal--open');
      }

      function closeMedia() {
        if (!modal || !content) return;
        modal.setAttribute('aria-hidden', 'true');
        modal.classList.remove('media-modal--open');
        content.innerHTML = '';
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest && e.target.closest('.activity-open');
        if (btn) {
          const type = btn.getAttribute('data-activity-media');
          if (type === 'image') {
            const img = btn.querySelector('img');
            openMedia({ type: 'image', src: img ? img.src : '' });
          }
          if (type === 'video') {
            const src = btn.getAttribute('data-video-src');
            openMedia({ type: 'video', poster: '{{ url_for("static", path="/images/bg2.jpg") }}', src });
          }
        }

        if (e.target?.dataset?.modalClose === 'true') closeMedia();
        if (e.target === closeBtn) closeMedia();
      });

      closeBtn?.addEventListener('click', closeMedia);
      modal?.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMedia();
      });
    })();
  </script>

  <footer class="site-footer">
    <div class="container footer__inner">
      <div class="footer__left">© {{ 2026 }} AYK. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
