<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AYK{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="container header__inner">
      <nav class="nav" aria-label="Primary navigation">
        <div class="brand" aria-label="AYK brand">
          <img src="{{ url_for('static', path='/images/logo.png') }}" alt="AYK Logo" class="brand__logo">
        </div>

        <div class="welcome-text">
          <h1 class="welcome-text__title">Welcome</h1>
        </div>

        <div class="nav__links">
          <a class="nav__link" href="/" data-nav="home">Home</a>
          <a class="nav__link" href="/#standards" data-nav="standards">Our Standards</a>
          <a class="nav__link" href="/#activities" data-nav="activities">Activities</a>
          <a class="nav__link" href="/#benefits" data-nav="benefits">Benefits</a>
          <a class="nav__link" href="/#feedback" data-nav="feedback">Feedback</a>
        </div>
        <span class="nav-underline" aria-hidden="true"></span>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main">
    {% block content %}{% endblock %}
  </main>

  <div class="media-modal" aria-hidden="true" role="dialog" aria-label="Media preview">
    <div class="media-modal__backdrop" data-modal-close="true"></div>
    <div class="media-modal__panel" role="document">
      <button class="media-modal__close" type="button" aria-label="Close">✕</button>
      <div class="media-modal__content" id="media-modal-content"></div>
    </div>
  </div>

  <script src="{{ url_for('static', path='/script.js') }}"></script>


  <footer class="site-footer">
    <div class="container footer__inner">
      <div class="footer__left">© {{ 2026 }} AYK. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
